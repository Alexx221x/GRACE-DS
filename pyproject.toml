[project]
name = "GRACE-DS"
version = "1.0.0"
description = "GRACE-DS is a guarded evaluation framework for pre-deployment testing of LLM-based AutoML agents on organization-specific tabular ML tasks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.1",
    "gymnasium>=1.3.0",
    "ipykernel>=7.2.0",
    "kaggle==2.1.2",
    "matplotlib>=3.10.9",
    "nbformat>=5.10.4",
    "numpy==2.0.2",
    "pandas==2.2.2",
    "plotnine>=0.15.3",
    "pyarrow>=24.0.0",
    "pyyaml>=6.0.3",
    "requests==2.32.4",
    "scikit-learn==1.6.1",
    "scipy==1.16.3",
    "statsmodels==0.14.6",
    "tiktoken==0.9.0",
    "uvicorn==0.46.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]
